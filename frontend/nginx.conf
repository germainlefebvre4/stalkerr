server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests in production if needed, or rely on Ingress.
    # In our design, Kubernetes Ingress routes /api/v1/ directly to the backend service.
}
