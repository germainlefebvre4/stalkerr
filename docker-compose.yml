# YAML anchors for common configurations
x-stalkerr-build: &stalkerr-build
  context: .
  dockerfile: Dockerfile
  args:
    VERSION: ${VERSION:-dev}
    COMMIT: ${COMMIT:-unknown}
    DATE: ${DATE:-unknown}

x-stalkerr-volumes: &stalkerr-volumes
  - ./config.yml:/app/config/config.yml:ro
  - ./m3u_playlist:/app/m3u_playlist:ro
  - ${DOWNLOADS_DIR:-./data/downloads}:/app/data/downloads
  - ${TEMP_DIR:-./data/temp}:/app/data/temp
  - ./data/downloads/movies:/app/data/downloads/movies
  - ./data/downloads/movies:/app/data/downloads/tvshows

x-stalkerr-environment: &stalkerr-environment
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_NAME: ${DB_NAME:-stalkerr}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_PORT: ${API_PORT:-8080}
  TMDB_API_KEY: ${TMDB_API_KEY:-}
  RADARR_URL: ${RADARR_URL:-http://radarr:7878}
  RADARR_API_KEY: ${RADARR_API_KEY:-}
  SONARR_URL: ${SONARR_URL:-http://sonarr:8989}
  SONARR_API_KEY: ${SONARR_API_KEY:-}
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

x-stalkerr-depends-on: &stalkerr-depends-on
  postgres:
    condition: service_healthy

x-stalkerr-resources: &stalkerr-resources
  resources:
    limits:
      cpus: '2.0'
      memory: 2G
    reservations:
      cpus: '0.5'
      memory: 512M

x-linuxserver-environment: &linuxserver-environment
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

services:
  postgres:
    image: postgres:18-alpine
    container_name: stalkerr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stalkerr}
      POSTGRES_USER: ${POSTGRES_USER:-stalkerr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stalkerr}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # volumes:
    #   - ./data/postgres:/var/lib/postgresql/data
      # Optional: Init scripts
      # - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - stalkerr-network
    profiles:
      - stalkerr
      - development

  server:
    build: *stalkerr-build
    image: germainlefebvre4/stalkerr:${VERSION:-dev}
    container_name: stalkerr-server
    command: ["./stalkeer", "server"]
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
      - "${ADMIN_PORT:-8081}:8081"
    depends_on: *stalkerr-depends-on
    volumes: *stalkerr-volumes
    environment: *stalkerr-environment
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - stalkerr-network
    deploy: *stalkerr-resources
    profiles:
      - stalkerr

  process:
    build: *stalkerr-build
    image: germainlefebvre4/stalkerr:${VERSION:-dev}
    container_name: stalkerr-process
    command: ["./stalkeer", "process", "--config", "/app/config/config.yml"]
    depends_on: *stalkerr-depends-on
    volumes: *stalkerr-volumes
    environment: *stalkerr-environment
    restart: no
    networks:
      - stalkerr-network
    deploy: *stalkerr-resources
    profiles:
      - stalkerr

  sonarr-sync:
    build: *stalkerr-build
    image: germainlefebvre4/stalkerr:${VERSION:-dev}
    container_name: stalkerr-sonarr-sync
    command: ["./stalkeer", "sonarr", "--config", "/app/config/config.yml"]
    depends_on: *stalkerr-depends-on
    volumes: *stalkerr-volumes
    environment: *stalkerr-environment
    restart: no
    networks:
      - stalkerr-network
    deploy: *stalkerr-resources
    profiles:
      - stalkerr

  radarr-sync:
    build: *stalkerr-build
    image: germainlefebvre4/stalkerr:${VERSION:-dev}
    container_name: stalkerr-radarr-sync
    command: ["./stalkeer", "radarr", "--config", "/app/config/config.yml"]
    depends_on: *stalkerr-depends-on
    volumes: *stalkerr-volumes
    environment: *stalkerr-environment
    restart: no
    networks:
      - stalkerr-network
    deploy: *stalkerr-resources
    profiles:
      - stalkerr

  resume-downloads:
    build: *stalkerr-build
    image: germainlefebvre4/stalkerr:${VERSION:-dev}
    container_name: stalkerr-resume-downloads
    command: ["./stalkeer", "resume-downloads", "--config", "/app/config/config.yml"]
    depends_on: *stalkerr-depends-on
    volumes: *stalkerr-volumes
    environment: *stalkerr-environment
    restart: no
    networks:
      - stalkerr-network
    deploy: *stalkerr-resources
    profiles:
      - stalkerr

  m3u-download:
    build: *stalkerr-build
    image: germainlefebvre4/stalkerr:${VERSION:-dev}
    container_name: stalkerr-m3u-download
    command: ["./stalkeer", "m3u-download", "--config", "/app/config/config.yml"]
    depends_on: *stalkerr-depends-on
    volumes: *stalkerr-volumes
    environment: *stalkerr-environment
    restart: no
    networks:
      - stalkerr-network
    deploy: *stalkerr-resources
    profiles:
      - stalkerr

  # DEVELOPMENT purpose only
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: stalkerr-sonarr
    environment: *linuxserver-environment
    volumes:
      - ./data/sonarr:/config
      - ./data/downloads:/downloads
    ports:
      - "${SONARR_PORT:-8989}:8989"
    restart: unless-stopped
    networks:
      - stalkerr-network
    profiles:
      - development

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: stalkerr-radarr
    environment: *linuxserver-environment
    volumes:
      - ./data/radarr:/config
      - ./data/downloads:/downloads
    ports:
      - "${RADARR_PORT:-7878}:7878"
    restart: unless-stopped
    networks:
      - stalkerr-network
    profiles:
      - development

  web:
    image: nginx:alpine
    container_name: stalkerr-web
    ports:
      - "${WEB_PORT:-8008}:80"
    volumes:
      - ./webserver/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./webserver/html:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - stalkerr-network
    profiles:
      - development

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stalkerr-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    restart: unless-stopped
    networks:
      - stalkerr-network
    profiles:
      - development
      - stalkerr

volumes:
  postgres_data:
    driver: local

networks:
  stalkerr-network:
    driver: bridge
