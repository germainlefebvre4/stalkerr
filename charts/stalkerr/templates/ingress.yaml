{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stalkerr.fullname" . }}
  labels:
    {{- include "stalkerr.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $.Values.frontend.enabled }}
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "stalkerr.fullname" $ }}
                port:
                  number: {{ $.Values.server.service.port }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "stalkerr.fullname" $ }}
                port:
                  number: {{ $.Values.server.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stalkerr.fullname" $ }}-frontend
                port:
                  number: {{ $.Values.frontend.service.port }}
          {{- else }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "stalkerr.fullname" $ }}
                port:
                  number: {{ .port }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
