{{- if .Values.jobs.process.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "stalkerr.fullname" . }}-process
  labels:
    {{- include "stalkerr.labels" . | nindent 4 }}
    app.kubernetes.io/component: cronjob-process
spec:
  schedule: {{ .Values.jobs.process.schedule | quote }}
  concurrencyPolicy: {{ .Values.jobs.process.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.jobs.process.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.jobs.process.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "stalkerr.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cronjob-process
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "stalkerr.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          restartPolicy: {{ .Values.jobs.process.restartPolicy }}
          containers:
            - name: process
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: {{ include "stalkerr.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - ./stalkeer
                - process
                # - --config
                # - /etc/stalkerr/config.yaml
              env:
                - name: STALKERR_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "stalkerr.secretName" . }}
                      key: database-password
                - name: DATABASE_URL
                  value: {{ include "stalkerr.databaseUrl" . | quote }}
                - name: TMDB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "stalkerr.secretName" . }}
                      key: tmdb-api-key
              resources:
                {{- toYaml .Values.jobs.process.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  # mountPath: /etc/stalkerr/config.yaml
                  mountPath: /app/config.yaml
                  subPath: config.yaml
                  readOnly: true
                - name: m3u-storage
                  mountPath: /data/m3u
                - name: temp-storage
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: {{ include "stalkerr.configMapName" . }}
            - name: m3u-storage
              persistentVolumeClaim:
                claimName: {{ include "stalkerr.m3uPvcName" . }}
            - name: temp-storage
              emptyDir: {}
{{- end }}
