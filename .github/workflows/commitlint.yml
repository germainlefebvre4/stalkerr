name: Commit Lint

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

jobs:
  lint-pr-title:
    name: Lint PR title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # The repository only allows squash merges, so the PR title becomes the
      # commit message on main - this is what release-please parses to
      # compute version bumps, so it must be a valid Conventional Commit.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
